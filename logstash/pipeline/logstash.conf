input {
  file {
    path => "/logs/application*.log"
    start_position => "beginning"
    codec => json
  }
}

filter {
  # Parse JSON if not already parsed
  if [message] =~ /^{.*}$/ {
    json {
      source => "message"
      target => "parsed"
    }
  }

  # Add application identifier
  mutate {
    add_field => { "application" => "chat-storage-ms" }
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "chat-storage-ms-logs-%{+YYYY.MM.dd}"
  }
  stdout { codec => rubydebug }
}